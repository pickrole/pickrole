# RPM for RHEL, AlmaLinux and Rocky Linux 8 and 9: the binary built in the EL8
# container, linked against webkit2gtk-4.0 (docs/adr/0010). Used by
# scripts/package-linux.sh el8.
name: pickrole
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: utils
priority: optional
maintainer: PickRole <https://github.com/pickrole/pickrole>
description: |
  Sign in to AWS IAM Identity Center, pick an account and role, and get
  working credentials in every terminal. Also sets up the CodeArtifact
  token for Maven.
vendor: PickRole
homepage: https://github.com/pickrole/pickrole
license: MIT

depends:
  - gtk3
  - webkit2gtk3

contents:
  - src: build/bin/pickrole
    dst: /usr/bin/pickrole
    file_info:
      mode: 0755
  - src: build/linux/pickrole.desktop
    dst: /usr/share/applications/pickrole.desktop
  - src: build/appicon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/pickrole.svg
  - src: LICENSE
    dst: /usr/share/licenses/pickrole/LICENSE
