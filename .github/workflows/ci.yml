name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The internal packages do not import Wails, so they build and test
      # without GTK or WebKit.
      - run: go vet ./internal/...
      - run: go test -race ./internal/...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  windows:
    name: Windows (tests and build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go vet ./...
      - run: go test ./internal/...
      - run: ./scripts/build-windows.ps1
        env:
          VERSION: ${{ github.sha }}
      # Fails on known vulnerabilities in what ships, standard library included.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary build/bin/pickrole.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pickrole-windows-amd64
          path: build/bin/pickrole.exe

  build:
    name: Build (RHEL 8 / 9)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    container: almalinux:8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/setup-el8.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: scripts/build-linux.sh
        env:
          VERSION: ${{ github.sha }}
      # Fails on known vulnerabilities in what ships, standard library included.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary build/bin/pickrole
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pickrole-linux-amd64
          path: build/bin/pickrole

  build-webkit41:
    name: Build (webkit2gtk-4.1)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Compile check only; packaging and install tests run in linux-packages.yml.
    container: ubuntu:22.04
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config git ca-certificates curl libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: scripts/build-linux.sh
        env:
          VERSION: ${{ github.sha }}
          WAILS_TAGS: webkit2_41
      # Fails on known vulnerabilities in what ships, standard library included.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary build/bin/pickrole
