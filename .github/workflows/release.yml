name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    name: Version and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails early, before any build, if CHANGELOG.md has no section for the version.
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/release-notes.sh "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux
    needs: version
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ needs.version.outputs.version }}

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Build and package
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./scripts/build-windows.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Fails on known vulnerabilities in what ships, standard library included.
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary build/bin/pickrole.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/bin/pickrole.exe -DestinationPath "dist/pickrole_${version}_windows_amd64.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows
          path: dist/*

  publish:
    name: Publish release
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS

      # The release notes are the version's section of CHANGELOG.md, written
      # for users, not the list of pull request titles.
      - run: scripts/release-notes.sh "${{ needs.version.outputs.version }}" > release-notes.md
      # Third-party action with write access: pinned to a commit, not a movable tag.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: release-notes.md
          # Tags with a suffix (v0.2.0-beta.1) are pre-releases: marked as
          # such and never shown as the latest release.
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.version.outputs.version, '-') }}
