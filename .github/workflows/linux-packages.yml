name: Linux packages

# Builds both Linux variants, packages them, and installs every package on the
# distributions it targets, checking that the binary finds all its libraries.
# Called by the release workflow, run on pull requests that change Linux
# packaging, and runnable by hand from the Actions tab.
on:
  pull_request:
    paths:
      - build/linux/**
      - scripts/build-linux.sh
      - scripts/package-linux.sh
      - scripts/setup-el8.sh
      - .github/workflows/linux-packages.yml
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version used in the package names
        type: string
        default: 0.0.0

permissions:
  contents: read

jobs:
  el8:
    name: Build (webkit2gtk-4.0, EL8)
    runs-on: ubuntu-latest
    # Built on EL8 so the binary runs on both RHEL 8 and RHEL 9 (docs/adr/0010).
    container: almalinux:8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/setup-el8.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: scripts/build-linux.sh
        env:
          VERSION: ${{ inputs.version || '0.0.0' }}
      # Fails on known vulnerabilities in what ships, standard library included.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary build/bin/pickrole
      - run: scripts/package-linux.sh el8 "${{ inputs.version || '0.0.0' }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-el8
          path: dist/*

  webkit41:
    name: Build (webkit2gtk-4.1)
    runs-on: ubuntu-latest
    # glibc 2.35: runs on Ubuntu 22.04+, Debian 12+ and Fedora (docs/adr/0019).
    container: ubuntu:22.04
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config git ca-certificates curl libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: scripts/build-linux.sh
        env:
          VERSION: ${{ inputs.version || '0.0.0' }}
          WAILS_TAGS: webkit2_41
      # Fails on known vulnerabilities in what ships, standard library included.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary build/bin/pickrole
      - run: scripts/package-linux.sh webkit41 "${{ inputs.version || '0.0.0' }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-webkit41
          path: dist/*

  install:
    name: Install on ${{ matrix.image }}
    needs: [el8, webkit41]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'almalinux:8', artifact: dist-linux-el8, package: el8_x86_64.rpm }
          - { image: 'rockylinux:9', artifact: dist-linux-el8, package: el8_x86_64.rpm }
          - { image: 'fedora:latest', artifact: dist-linux-webkit41, package: fedora_x86_64.rpm }
          - { image: 'ubuntu:22.04', artifact: dist-linux-webkit41, package: amd64.deb }
          - { image: 'ubuntu:24.04', artifact: dist-linux-webkit41, package: amd64.deb }
          - { image: 'debian:12', artifact: dist-linux-webkit41, package: amd64.deb }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install the package
        run: |
          pkg=$(ls dist/*_${{ matrix.package }})
          if command -v dnf >/dev/null; then
            dnf install -y "./${pkg}"
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y "./${pkg}"
          fi
      - name: Check the installed files and libraries
        run: |
          test -x /usr/bin/pickrole
          test -f /usr/share/applications/pickrole.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/pickrole.svg
          ldd /usr/bin/pickrole | tee ldd.txt
          if grep -q 'not found' ldd.txt; then
            echo "::error::missing libraries on ${{ matrix.image }}"
            exit 1
          fi
