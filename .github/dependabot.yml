version: 2
updates:
  # Actions are pinned to commits (see the workflows); this keeps the pins current,
  # in one pull request so the workflows move together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Frontend packages (package-lock.json).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # svelte-check (up to 4.7.6) only accepts TypeScript 5 and 6 as a peer,
      # so `npm ci` fails with TypeScript 7. Remove this once it supports 7.
      - dependency-name: typescript
        versions: ['>=7']

  # Go modules. The Go toolchain itself (go.mod `toolchain`, scripts/setup-el8.sh)
  # is updated by hand; govulncheck in CI flags when it's due (docs/adr/0021).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go-modules:
        patterns: ['*']
